spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      embedding:
        options:
          model: text-embedding-3-small

  application:
    name: document-qa

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/docqa}
    username: ${POSTGRES_USER:docqa}
    password: ${POSTGRES_PASSWORD:docqa_local_dev}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

server:
  port: ${APP_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true

docqa:
  ai:
    provider: ${DOCQA_AI_PROVIDER:stub}

  chunking:
    chunk-size: 700
    overlap: 100
    default-top-k: 5
    # Scale differs by embedder: the stub is bag-of-words, OpenAI is semantic.
    # Overridden per provider below.
    similarity-threshold: ${DOCQA_SIMILARITY_THRESHOLD:0.25}

  conversation:
    max-turns: 6
    token-budget: 1500

  ingestion:
    max-file-size: 20MB
    staging-directory: ${DOCQA_STAGING_DIR:${java.io.tmpdir}/docqa-staging}
    worker-threads: 2
    queue-capacity: 50
    retry-after-seconds: 60
    orphan-timeout-minutes: 30

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  include-application-name: false
  level:
    org.flywaydb: INFO
